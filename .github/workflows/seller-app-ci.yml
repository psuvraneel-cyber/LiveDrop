name: Seller App CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
    paths:
      - "seller-app/**"
      - ".github/workflows/seller-app-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "seller-app/**"
      - ".github/workflows/seller-app-ci.yml"
  workflow_dispatch:

jobs:
  validate-flutter:
    name: Analyze, Test & Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter static analysis
        run: flutter analyze

      - name: Run Flutter unit & widget tests
        run: flutter test

      - name: Build Android Staging Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "::add-mask::$SUPABASE_ANON_KEY"
          fi
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_ENV=staging

      - name: Upload Staging APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: seller-app-staging-debug
          path: seller-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
