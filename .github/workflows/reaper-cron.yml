name: LiveDrop Hold Reaper Cron

on:
  # BACKUP TRIGGER ONLY. The database schedules public.release_expired_holds()
  # every minute itself via pg_cron when the extension is available
  # (supabase/migrations/036_schedule_reaper_in_database.sql), and checkout
  # also releases stale unclaimed holds lazily (migration 035). GitHub runs
  # scheduled workflows on a best-effort basis (often far less often than
  # requested), so this job is a redundant safety net: harmless where pg_cron
  # runs (the reaper is idempotent and skips locked rows) and the only automatic
  # trigger where pg_cron is unavailable. The reaper never expires holds whose
  # buyer has submitted a payment claim.
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-reaper:
    name: Execute release_expired_holds()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Execute operational reaper
        run: node scripts/run-reaper.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
