name: Database Deploy

# Applies the seller-app audit migrations (034–044) to the hosted Supabase database and
# runs read-only post-deploy checks. Manual only, main branch only.
#
# Required secret : SUPABASE_DB_URL  (Supabase -> Connect -> "Session pooler" connection string)
# Recommended     : protect the "supabase-production" environment (Settings -> Environments)
#
# The Actions log of a public repository is public: the SQL scripts used here print only
# catalog facts and counts, never personal data.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check-only = read-only preflight + checks; apply = apply 034–044 then check"
        type: choice
        options: [check-only, apply]
        default: check-only

permissions:
  contents: read

concurrency:
  group: database-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ inputs.mode }} migrations 034–044
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      PGCONNECT_TIMEOUT: "15"
      PGAPPNAME: livedrop-db-deploy
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require the connection secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL is not set (Supabase -> Connect -> Session pooler)."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
          psql --version

      - name: Preflight (read-only)
        id: preflight
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f scripts/db-deploy/preflight.sql | tee preflight.log
          state=$(sed -n 's/^m035_state=//p' preflight.log)
          case "$state" in none|complete) ;; *) echo "::error::unexpected 035 state '$state'"; exit 1;; esac
          echo "m035_state=$state" >> "$GITHUB_OUTPUT"

      - name: Apply 034 (lock down public view privileges)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/034_lock_down_public_view_privileges.sql

      - name: Apply 035 (payment claim safety and refunds)
        if: inputs.mode == 'apply' && steps.preflight.outputs.m035_state == 'none'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/035_payment_claim_safety_and_refunds.sql

      - name: Skip 035 (already applied)
        if: inputs.mode == 'apply' && steps.preflight.outputs.m035_state == 'complete'
        run: echo "::notice::migration 035 is already fully applied (column, functions and constraint present); skipped."

      - name: Apply 036 (reaper schedule in the database)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/036_schedule_reaper_in_database.sql

      - name: Apply 037 (claim hold and shipping quote; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/037_claim_hold_and_shipping_quote.sql

      - name: Apply 038 (storage, suspension and UTR guards; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/038_storage_suspension_and_utr_guards.sql

      - name: Apply 039 (drop lifecycle, payee and offline-sale guards; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/039_drop_lifecycle_payee_and_offline_sale_guards.sql

      - name: Apply 040 (seller sales summary; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/040_seller_sales_summary.sql

      - name: Apply 041 (seller push notifications; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/041_seller_push_notifications.sql

      - name: Apply 042 (platform admin console; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/042_platform_admin_console.sql

      - name: Apply 043 (UPI link for personal UPI IDs; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/043_upi_p2p_payment_link.sql

      - name: Apply 044 (order receipt WhatsApp number; idempotent)
        if: inputs.mode == 'apply'
        run: psql "$DATABASE_URL" -X -1 -v ON_ERROR_STOP=1 -f supabase/migrations/044_order_receipt_whatsapp_number.sql

      - name: Record migrations in Supabase history (if present)
        if: inputs.mode == 'apply'
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regclass('supabase_migrations.schema_migrations') IS NOT NULL THEN
              IF EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations m
                         JOIN (VALUES ('034', 'lock_down_public_view_privileges'),
                                      ('035', 'payment_claim_safety_and_refunds'),
                                      ('036', 'schedule_reaper_in_database'),
                                      ('037', 'claim_hold_and_shipping_quote'),
                                      ('038', 'storage_suspension_and_utr_guards'),
                                      ('039', 'drop_lifecycle_payee_and_offline_sale_guards'),
                                      ('040', 'seller_sales_summary'),
                                      ('041', 'seller_push_notifications'),
                                      ('042', 'platform_admin_console'),
                                      ('043', 'upi_p2p_payment_link'),
                                      ('044', 'order_receipt_whatsapp_number')) AS e(version, name)
                           ON e.version = m.version
                         WHERE m.name IS DISTINCT FROM e.name) THEN
                RAISE EXCEPTION 'migration history already has 034-044 rows with different names; resolve manually';
              END IF;
              INSERT INTO supabase_migrations.schema_migrations (version, name)
              VALUES ('034', 'lock_down_public_view_privileges'),
                     ('035', 'payment_claim_safety_and_refunds'),
                     ('036', 'schedule_reaper_in_database'),
                     ('037', 'claim_hold_and_shipping_quote'),
                     ('038', 'storage_suspension_and_utr_guards'),
                     ('039', 'drop_lifecycle_payee_and_offline_sale_guards'),
                     ('040', 'seller_sales_summary'),
                     ('041', 'seller_push_notifications'),
                     ('042', 'platform_admin_console'),
                     ('043', 'upi_p2p_payment_link'),
                     ('044', 'order_receipt_whatsapp_number')
              ON CONFLICT (version) DO NOTHING;
              RAISE NOTICE 'recorded 034–044 in supabase_migrations.schema_migrations';
            ELSE
              RAISE NOTICE 'no supabase_migrations.schema_migrations table; nothing recorded';
            END IF;
          END $$;
          NOTIFY pgrst, 'reload schema';
          SQL

      - name: Post-deploy checks (read-only)
        # Before the first apply these checks are expected to fail; that must not mark a check-only run red.
        continue-on-error: ${{ inputs.mode == 'check-only' }}
        run: |
          strict=off
          if [ "${{ inputs.mode }}" = "apply" ]; then strict=on; fi
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -v strict_cron=$strict -f scripts/db-deploy/post_checks.sql
