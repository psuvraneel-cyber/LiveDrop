name: Deploy Edge Functions

# Deploys supabase/functions/push-dispatch (SA-NOT-001, ADR-015) to the hosted project.
# Manual, main branch only. Needs the repository secret SUPABASE_ACCESS_TOKEN
# (supabase.com -> Account -> Access tokens). The FCM_SERVICE_ACCOUNT secret is set in the
# Supabase dashboard (Edge Functions -> Secrets), never in GitHub.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: supabase-production
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: aoagqdtnrbmayfoajzes
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN is not set"; exit 1
          fi
      - name: Deploy push-dispatch
        run: npx --yes supabase@2 functions deploy push-dispatch --project-ref "$PROJECT_REF" --no-verify-jwt
