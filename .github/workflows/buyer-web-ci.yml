name: Buyer Web CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
    paths:
      - "buyer-web/**"
      - ".github/workflows/buyer-web-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "buyer-web/**"
      - ".github/workflows/buyer-web-ci.yml"

jobs:
  validate-web:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: buyer-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: buyer-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit/Component Tests
        run: npm test

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder-id.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
