name: Secret Scan

# SA-SEC-002: block new credentials from landing in the repository.
#
# Scans only the commits introduced by the push or pull request, not the whole
# history: the history still contains a credential that was leaked in commit
# 0abdaeb (scripts/seed-legitimate-staging-drop.mjs). That credential must be
# rotated by the owner and the history purge decided separately; see
# docs/ops/credential-rotation-runbook.md. Findings are redacted in the log.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# Pull requests share one group per ref (a newer run scans base..head, which
# covers every commit of the PR, so cancelling the older run loses nothing).
# Push runs get a unique group per run: each push scans only before..after, so
# a cancelled pending push run would leave its commits unscanned for good.
concurrency:
  group: secret-scan-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GITLEAKS_VERSION: "v8.30.1"

jobs:
  gitleaks:
    name: gitleaks (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.24.11"
          cache: false

      - name: Install gitleaks
        # Built from the Go module proxy; the module checksum is verified
        # against sum.golang.org, so the pinned version cannot be swapped.
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Determine commit range
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          PUSH_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ "$EVENT_NAME" = "pull_request" ]; then
            LOG_OPTS="${PR_BASE_SHA}..${PR_HEAD_SHA}"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] \
               && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            LOG_OPTS="${PUSH_BEFORE}..${PUSH_AFTER}"
          elif [ "$PUSH_REF" != "refs/heads/${DEFAULT_BRANCH}" ] \
               && git rev-parse --verify -q "refs/remotes/origin/${DEFAULT_BRANCH}" > /dev/null; then
            # New branch (or force-push): everything not already on the default branch.
            LOG_OPTS="origin/${DEFAULT_BRANCH}..${PUSH_AFTER}"
          else
            # Force-push to the default branch: the previous tip is unknown.
            echo "::notice::Previous commit unavailable; scanning only ${PUSH_AFTER}."
            LOG_OPTS="-1 ${PUSH_AFTER}"
          fi
          echo "Scanning git log ${LOG_OPTS}"
          echo "log_opts=${LOG_OPTS}" >> "$GITHUB_OUTPUT"

      - name: Scan new commits
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: |
          gitleaks git \
            --config .gitleaks.toml \
            --log-opts="$LOG_OPTS" \
            --redact \
            --verbose \
            --no-banner \
            --exit-code 1 \
            --report-format json \
            --report-path "$RUNNER_TEMP/gitleaks-report.json" \
            .

      - name: Summarise findings (redacted)
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/gitleaks-report.json" ] || exit 0
          python3 - "$RUNNER_TEMP/gitleaks-report.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          findings = json.load(open(sys.argv[1]))
          print("### gitleaks found %d potential secret(s)" % len(findings))
          print("| Rule | File | Line | Commit |")
          print("|---|---|---|---|")
          for f in findings:
              print("| %s | %s | %s | %s |" % (f["RuleID"], f["File"], f["StartLine"], f["Commit"][:12]))
          print()
          print("Remove the secret from the commits, rotate it if it was ever pushed, and see docs/ops/credential-rotation-runbook.md.")
          PY
